name: CI

# macOS minutes count 10x against the Actions quota, so CI skips draft PRs and feature-branch pushes.
# Run it by hand on any branch with: gh workflow run CI --ref <branch>
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "*.html"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "*.html"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Worker API tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  ios:
    name: iOS tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The project and .storekit file are authored in Xcode 27; the image default is older.
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Swift package tests
        working-directory: ios/CommonCamKit
        run: swift test
      - name: App tests (simulator)
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries | map(select(.key | contains("iOS"))) | sort_by(.key | [scan("[0-9]+") | tonumber]) | last.value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project CommonCam.xcodeproj -scheme CommonCam -destination "id=$DEVICE_ID"

  deploy-dev:
    name: Deploy API to dev
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Ships only the Worker, so it is gated on the Worker tests alone.
    needs: [api]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply commoncam --remote
      - name: Deploy Worker
        run: npx wrangler deploy --name commoncam-api-dev
      - name: Set MEDIA_SIGNING_KEY
        env:
          MEDIA_SIGNING_KEY: ${{ secrets.MEDIA_SIGNING_KEY }}
        run: printf '%s' "$MEDIA_SIGNING_KEY" | npx wrangler secret put MEDIA_SIGNING_KEY --name commoncam-api-dev
      - name: Set APNS_PRIVATE_KEY (skipped until the secret exists)
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: |
          if [ -z "$APNS_PRIVATE_KEY" ]; then echo "APNS_PRIVATE_KEY not set; pushes stay off"; exit 0; fi
          printf '%s' "$APNS_PRIVATE_KEY" | npx wrangler secret put APNS_PRIVATE_KEY --name commoncam-api-dev
