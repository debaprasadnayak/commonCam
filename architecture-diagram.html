<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>commonCam · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7fbfc;
      --color-ink:     #153240;
      --color-muted:   #3f5d6b;
      --color-accent:  #d6002f;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width); this
       wrapper lets a narrow screen scroll the diagram instead of the page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · commonCam</p>
    <h1>Originals go straight from phone to storage</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">commonCam system architecture</title>
        <desc id="architecture-desc">The iOS app calls a serverless API, uploads originals directly to object storage with pre-signed URLs, and reads previews through a CDN, while scheduled jobs delete expired media.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f5d6b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d6002f"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#007079"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f7fbfc"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="40" y="216" width="248" height="184" rx="8"
              fill="rgba(21,50,64,0.02)" stroke="rgba(21,50,64,0.10)" stroke-width="0.8"/>
        <rect x="52" y="220" width="56" height="12" rx="2" fill="#f7fbfc"/>
        <text x="80" y="229" fill="#4f6c79" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">DEVICE</text>

        <rect x="368" y="48" width="768" height="520" rx="8"
              fill="rgba(21,50,64,0.02)" stroke="rgba(21,50,64,0.10)" stroke-width="0.8"/>
        <rect x="384" y="52" width="120" height="12" rx="2" fill="#f7fbfc"/>
        <text x="444" y="61" fill="#4f6c79" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">BACKEND · SERVERLESS</text>

        <!-- Arrows first (behind boxes) -->
        <!-- App → Apple: purchase -->
        <line x1="164" y1="264" x2="164" y2="168" stroke="#007079" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Apple → API: receipt (dashed, passive) -->
        <line x1="272" y1="120" x2="416" y2="120" stroke="#007079" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <!-- App → API: HTTPS -->
        <path d="M 272,288 H 336 Q 344,288 344,280 V 152 Q 344,144 352,144 H 416"
              fill="none" stroke="#007079" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- App → Media: direct upload (primary flow) -->
        <line x1="272" y1="312" x2="416" y2="312" stroke="#d6002f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- CDN → App: previews (dashed return) -->
        <path d="M 416,492 H 320 Q 312,492 312,484 V 344 Q 312,336 304,336 H 272"
              fill="none" stroke="#3f5d6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- API → Media: sign URL (dashed, passive) -->
        <line x1="504" y1="168" x2="504" y2="264" stroke="#3f5d6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- Media → CDN: origin -->
        <line x1="504" y1="360" x2="504" y2="456" stroke="#3f5d6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- API → DB: metadata -->
        <line x1="592" y1="132" x2="680" y2="132" stroke="#3f5d6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Jobs → DB: scan -->
        <line x1="928" y1="132" x2="840" y2="132" stroke="#3f5d6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Jobs → Media: delete -->
        <path d="M 1024,168 V 304 Q 1024,312 1016,312 H 592"
              fill="none" stroke="#3f5d6b" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="188" width="60" height="12" rx="2" fill="#f7fbfc"/>
        <text x="202" y="197" fill="#007079" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PURCHASE</text>

        <rect x="318" y="100" width="52" height="12" rx="2" fill="#f7fbfc"/>
        <text x="344" y="109" fill="#007079" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECEIPT</text>

        <rect x="284" y="268" width="40" height="12" rx="2" fill="#f7fbfc"/>
        <text x="304" y="277" fill="#007079" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

        <rect x="356" y="294" width="48" height="12" rx="2" fill="#f7fbfc"/>
        <text x="380" y="303" fill="#d6002f" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

        <rect x="320" y="404" width="52" height="12" rx="2" fill="#f7fbfc"/>
        <text x="346" y="413" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PREVIEW</text>

        <rect x="512" y="402" width="48" height="12" rx="2" fill="#f7fbfc"/>
        <text x="536" y="411" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ORIGIN</text>

        <rect x="512" y="210" width="60" height="12" rx="2" fill="#f7fbfc"/>
        <text x="542" y="219" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN URL</text>

        <rect x="620" y="112" width="32" height="12" rx="2" fill="#f7fbfc"/>
        <text x="636" y="121" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">META</text>

        <rect x="868" y="112" width="32" height="12" rx="2" fill="#f7fbfc"/>
        <text x="884" y="121" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCAN</text>

        <rect x="780" y="292" width="48" height="12" rx="2" fill="#f7fbfc"/>
        <text x="804" y="301" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE</text>

        <!-- Node: Apple App Store (external) -->
        <rect x="56" y="96" width="216" height="72" rx="6" fill="#f7fbfc"/>
        <rect x="56" y="96" width="216" height="72" rx="6" fill="rgba(21,50,64,0.03)" stroke="rgba(21,50,64,0.30)" stroke-width="1"/>
        <rect x="64" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,50,64,0.22)" stroke-width="0.8"/>
        <text x="78" y="113" fill="#4f6c79" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="164" y="136" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apple App Store</text>
        <text x="164" y="152" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StoreKit 2 · IAP</text>

        <!-- Node: iOS app (input) -->
        <rect x="56" y="264" width="216" height="96" rx="6" fill="#f7fbfc"/>
        <rect x="56" y="264" width="216" height="96" rx="6" fill="rgba(63,93,107,0.10)" stroke="#4f6c79" stroke-width="1"/>
        <rect x="64" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,108,121,0.40)" stroke-width="0.8"/>
        <text x="78" y="281" fill="#4f6c79" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="164" y="308" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">commonCam iOS app</text>
        <text x="164" y="326" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SwiftUI · AVFoundation</text>
        <text x="164" y="340" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Metal filters · upload queue</text>

        <!-- Node: API (backend) -->
        <rect x="416" y="96" width="176" height="72" rx="6" fill="#f7fbfc"/>
        <rect x="416" y="96" width="176" height="72" rx="6" fill="#ffffff" stroke="#153240" stroke-width="1"/>
        <rect x="424" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,50,64,0.40)" stroke-width="0.8"/>
        <text x="438" y="113" fill="#153240" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="504" y="136" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API</text>
        <text x="504" y="152" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Workers or Functions</text>

        <!-- Node: Metadata DB (store) -->
        <rect x="680" y="96" width="160" height="72" rx="6" fill="#f7fbfc"/>
        <rect x="680" y="96" width="160" height="72" rx="6" fill="rgba(21,50,64,0.05)" stroke="#3f5d6b" stroke-width="1"/>
        <rect x="688" y="104" width="24" height="12" rx="2" fill="transparent" stroke="rgba(63,93,107,0.50)" stroke-width="0.8"/>
        <text x="700" y="113" fill="#3f5d6b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="760" y="136" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Metadata DB</text>
        <text x="760" y="152" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">groups · members · items</text>

        <!-- Node: Scheduled jobs (backend) -->
        <rect x="936" y="96" width="176" height="72" rx="6" fill="#f7fbfc"/>
        <rect x="936" y="96" width="176" height="72" rx="6" fill="#ffffff" stroke="#153240" stroke-width="1"/>
        <rect x="944" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,50,64,0.40)" stroke-width="0.8"/>
        <text x="958" y="113" fill="#153240" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
        <text x="1024" y="136" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduled jobs</text>
        <text x="1024" y="152" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expiry · reminders (APNs)</text>

        <!-- Node: Media store (focal) -->
        <rect x="416" y="264" width="176" height="96" rx="6" fill="#f7fbfc"/>
        <rect x="416" y="264" width="176" height="96" rx="6" fill="rgba(214,0,47,0.08)" stroke="#d6002f" stroke-width="1"/>
        <rect x="424" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(214,0,47,0.50)" stroke-width="0.8"/>
        <text x="438" y="281" fill="#d6002f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBJ</text>
        <text x="504" y="308" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Media store</text>
        <text x="504" y="326" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cloudflare R2</text>
        <text x="504" y="340" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">originals · pre-signed URLs</text>

        <!-- Node: CDN (external / edge) -->
        <rect x="416" y="456" width="176" height="72" rx="6" fill="#f7fbfc"/>
        <rect x="416" y="456" width="176" height="72" rx="6" fill="rgba(21,50,64,0.03)" stroke="rgba(21,50,64,0.30)" stroke-width="1"/>
        <rect x="424" y="464" width="28" height="12" rx="2" fill="transparent" stroke="rgba(21,50,64,0.22)" stroke-width="0.8"/>
        <text x="438" y="473" fill="#4f6c79" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDN</text>
        <text x="504" y="496" fill="#153240" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CDN</text>
        <text x="504" y="512" fill="#3f5d6b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">thumbnails · previews</text>

        <!-- Legend strip -->
        <line x1="40" y1="600" x2="1240" y2="600" stroke="rgba(21,50,64,0.10)" stroke-width="0.8"/>
        <text x="40" y="620" fill="#3f5d6b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="636" width="14" height="10" rx="2" fill="rgba(214,0,47,0.08)" stroke="#d6002f" stroke-width="1"/>
        <text x="60" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Focal store</text>

        <rect x="170" y="636" width="14" height="10" rx="2" fill="#ffffff" stroke="#153240" stroke-width="1"/>
        <text x="190" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <rect x="280" y="636" width="14" height="10" rx="2" fill="rgba(21,50,64,0.05)" stroke="#3f5d6b" stroke-width="1"/>
        <text x="300" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="370" y="636" width="14" height="10" rx="2" fill="rgba(21,50,64,0.03)" stroke="rgba(21,50,64,0.30)" stroke-width="1"/>
        <text x="390" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">External / edge</text>

        <rect x="510" y="636" width="14" height="10" rx="2" fill="rgba(63,93,107,0.10)" stroke="#4f6c79" stroke-width="1"/>
        <text x="530" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Device</text>

        <line x1="620" y1="642" x2="648" y2="642" stroke="#007079" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="656" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">HTTPS / external call</text>

        <line x1="790" y1="642" x2="818" y2="642" stroke="#d6002f" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="826" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Primary flow (upload)</text>

        <line x1="960" y1="642" x2="988" y2="642" stroke="#3f5d6b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="996" y="644" fill="#3f5d6b" font-size="8.5" font-family="'Geist', sans-serif">Passive / return</text>
      </svg>
    </div>
  </div>
</body>
</html>
